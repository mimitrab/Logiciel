# Vérifie à chaque modification du code que la sécurité et la facturation fonctionnent toujours.
name: Tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: saccades_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Les fichiers compilés sont à jour
        run: npm run construire && git diff --exit-code -- server/public
      - name: Tests de l'API
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:tests@localhost:5432/saccades_tests
